name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar workload Android
        run: dotnet workload install android

      # APK precisa estar assinado para instalar. Esta keystore é gerada na hora (uso pessoal).
      # Para atualizar o app por cima de uma versão antiga, guarde sempre a mesma keystore.
      - name: Criar keystore
        run: >
          keytool -genkeypair -keystore nx.keystore -alias nx -keyalg RSA -keysize 2048
          -validity 10000 -storepass nxextractor -keypass nxextractor -dname "CN=NX Extractor"

      - name: Compilar
        run: >
          dotnet publish NxExtractor.Android.csproj -c Release -f net8.0-android -o out
          -p:AcceptAndroidSDKLicenses=True
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore=${{ github.workspace }}/nx.keystore
          -p:AndroidSigningKeyAlias=nx
          -p:AndroidSigningKeyPass=nxextractor
          -p:AndroidSigningStorePass=nxextractor

      - uses: actions/upload-artifact@v4
        with:
          name: NxExtractor-apk
          path: out/*-Signed.apk
